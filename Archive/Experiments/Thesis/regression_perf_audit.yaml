# Thesis evaluation, development-support use case 2: REGRESSION TESTING over
# real development history. Five pinned TimelyMon commits from the development
# branch (all reachable on the remote), each at 1 and 4 workers, on the
# identical policy/data matrix (same cells and seeds) as
# tuning_temporal_clean_up.yaml.
#
# The exact change each lane adds over the previous one is stated inline and
# tabulated in README.md. All lanes run default clean-up thresholds.
#
# Expected effects (from the hand-run audit PERF_AUDIT_2026-09-15.md):
#   - every lane at 4 workers exhibits the F2 pathology (worker 0 feeds and
#     steps, the frontier stalls, GC starves, memory grows; audit: 2.3 GB on
#     Linear where 1 worker needs 273 MB) -- the fix lives in the perf-audit
#     follow-ups commit (4baad676 on perf-audit-2026-09), which joins as a
#     sixth lane once that branch is pushed to git.ku.dk;
#   - lane 2 removes a compile-time validation harness and lane 5 changes
#     only the online path, so both are expected offline-neutral vs their
#     predecessors -- deliberate null checks.
# distinct_outputs must be identical across ALL lanes in every cell; any
# deviation is a caught regression.

experiment_name: regression_perf_audit

monitors:
  # Lane 1: pre-audit baseline (same pin as ooo_claim_family.yaml).
  - identifier: TimelyMon
    name: TM ec86e20a w1
    branch: development
    commit: ec86e20a86aa64bc6aed41e2c8bfb264f9420b90
    params:
      worker: 1
      output_mode: 1
  - identifier: TimelyMon
    name: TM ec86e20a w4
    branch: development
    commit: ec86e20a86aa64bc6aed41e2c8bfb264f9420b90
    params:
      worker: 4
      output_mode: 1
  # Lane 2: + dc88da9a (remove shadow-agenda validation harness; compile-time
  # feature, expected runtime-neutral -- null check).
  - identifier: TimelyMon
    name: TM dc88da9a w1
    branch: development
    commit: dc88da9a2bec82b7737e92f7e5ce03299a1f6fd6
    params:
      worker: 1
      output_mode: 1
  - identifier: TimelyMon
    name: TM dc88da9a w4
    branch: development
    commit: dc88da9a2bec82b7737e92f7e5ce03299a1f6fd6
    params:
      worker: 4
      output_mode: 1
  # Lane 3: + b0248ab4 (watermark forced emission steps to quiescence instead
  # of once).
  - identifier: TimelyMon
    name: TM b0248ab4 w1
    branch: development
    commit: b0248ab44ab49c78535f5c048704fd3316813861
    params:
      worker: 1
      output_mode: 1
  - identifier: TimelyMon
    name: TM b0248ab4 w4
    branch: development
    commit: b0248ab44ab49c78535f5c048704fd3316813861
    params:
      worker: 4
      output_mode: 1
  # Lane 4: + c4a82d1d (True/Value streams: range emitters via shared
  # range_leaf; empty-payload bug fix) + e5e64e1d (.gitignore only, no code).
  # This is the commit the perf audit's baseline binary was built from.
  - identifier: TimelyMon
    name: TM e5e64e1d w1
    branch: development
    commit: e5e64e1dca8dfb5e906bbdc06b3b04ad5be7098a
    params:
      worker: 1
      output_mode: 1
  - identifier: TimelyMon
    name: TM e5e64e1d w4
    branch: development
    commit: e5e64e1dca8dfb5e906bbdc06b3b04ad5be7098a
    params:
      worker: 4
      output_mode: 1
  # Lane 5: + f6e7e6d1 (online path: drain watermark releases on their own
  # line, idle-tolerant). Online-only change; offline numbers are expected to
  # equal lane 4 -- a null check. This is the development branch head.
  - identifier: TimelyMon
    name: TM f6e7e6d1 w1
    branch: development
    commit: f6e7e6d1255b86abb3c31e00d1a8398eb4f2a4e3
    params:
      worker: 1
      output_mode: 1
  - identifier: TimelyMon
    name: TM f6e7e6d1 w4
    branch: development
    commit: f6e7e6d1255b86abb3c31e00d1a8398eb4f2a4e3
    params:
      worker: 4
      output_mode: 1
  # (A sixth lane with the perf-audit follow-ups -- 4baad676: streaming
  # executor / per-time-point sessions [F6], ingestion barrier [F2], obs_seq
  # cached views [F5], --ts-lookahead pre-feeding -- is currently unreachable:
  # branch perf-audit-2026-09 is not on git.ku.dk. Re-add it once pushed.)

runtime_constraints:
  upper_bound: 300

data_setup:
  type: SignatureContract
  SignatureContract:
    trace_length: 1000
    event_rate: 10

# Flag-identical to the formula_search.py contract (see the tuning
# experiment); fields not listed must stay absent.
policy_setup:
  type: MfotlPolicyContract
  MfotlPolicyContract:
    num_preds: 4
    lb: 0
    ub: 100
    delta: 30
    prob_once: 0.25
    prob_since: 0.15
    prob_eventually: 0.25
    prob_until: 0.15
    prob_eand: 0.1

synthetic_config:
  data_source: SignatureGenerator
  policy_source: MfotlPolicyGenerator
  experiment:
    num_operators: [5]
    num_fvs: [2]
    num_setting: [0, 1, 2, 3]
    num_data_set_sizes: [10000, 50000, 100000]

experiment_type: Signature

tools_to_build:
  - TM ec86e20a w1
  - TM ec86e20a w4
  - TM dc88da9a w1
  - TM dc88da9a w4
  - TM b0248ab4 w1
  - TM b0248ab4 w4
  - TM e5e64e1d w1
  - TM e5e64e1d w4
  - TM f6e7e6d1 w1
  - TM f6e7e6d1 w4

oracle:
  enabled: false

# Settings 0-3 = the first four formula-search winners, identical to the
# tuning experiment's settings 0-3 (size-independent keys cover all sizes).
seeds:
  '[5, 2, 0]': [314159265, 12]
  '[5, 2, 1]': [314159265, 22]
  '[5, 2, 2]': [314159265, 45]
  '[5, 2, 3]': [314159265, 135]

components:
  - identifier: SignatureGenerator
    commit: d8442ab1473ea8f0a9c49836d3bf56bfd0b60672
  - identifier: MfotlPolicyGenerator
    commit: fef5f8f5551a36dac4aa45cc7c48bef09964a265
  - identifier: ReplayerConverter
    commit: d8442ab1473ea8f0a9c49836d3bf56bfd0b60672
