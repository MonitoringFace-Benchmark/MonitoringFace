# Companion to tuning_temporal_clean_up.yaml: the INTERVAL-SIZE axis.
# Identical 10 clean-up lanes and the same 10 formula-search winner seeds, but
# the generator contract's interval bound is scaled x10 (ub 100 -> 1000).
# Phase 3 of formula_search.py verified that all 10 winner seeds regenerate
# STRUCTURALLY IDENTICAL formulas under ub 1000 (only the interval constants
# widen), so cells here differ from the base experiment in window width alone.
# Two sizes suffice for the axis question (does wider retention amplify the
# theta-effects and their trend?); the base file carries the fine size grid.

experiment_name: tuning_interval_scaling

monitors:
  - identifier: TimelyMon
    name: TM t0.0 static
    branch: perf-audit-2026-09
    commit: ad3309310dff1390fd38fe1519ee53e9011185ff
    params: &lane
      worker: 1
      output_mode: 1
      future_temporal_clean_up: 0.0
      past_temporal_clean_up: 0.0
      relational_clean_up: 0.1
      clean_up_step: 0.0
  - identifier: TimelyMon
