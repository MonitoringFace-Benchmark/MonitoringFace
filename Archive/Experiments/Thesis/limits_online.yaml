# Experiment A (limits): random formulas with bounded past and future
# operators on medium-delayed data, online, four lanes on one disordered
# stream. GENERATED by limits_formula_search.py final-config from the screen
# limits_screen_20261002_210608: the first six formulas in seed order that all four tools monitor
# within 60 s with at least 20 verdicts. Setting index =
# policy seed * 10 + data seed number (1, 2).
#   MonPoly                Disorderer (bridge) + dynamic Sorter, chain accounting
#                          (exact positions: EmissionTiming.sorted_lane)
#   TimelyMon common       Disorderer (csv) + dynamic PrefixRebuilder (watermarks)
#   TimelyMon tp-interval  Disorderer (csv), identity: ELAPSED point claims
#   OOOMon                 Disorderer (csv), identity: ELAPSED point claims
# Medium disorder: uniform displacement up to 50 lines; the prefix watermark
# trails the newest data by 4 time-points (median, p90 5), about half the
# formulas' windows.

experiment_name: limits_online
runtime_setting: online

OnlineExperimentContractGeneral:
  data_source_type: file
  mode: accelerated
  timestamp_units: seconds
  maximum_latency: 60000
  accumulative_time: 900

monitors:
  - identifier: MonPoly
    name: MonPoly
    commit: bc752d37f1d4560b5667eddac9dd1670451b758e
    params:
      OnlineExperimentContractTool:
        format: log
        response_mode: current-timepoint
        output_collection_mode: before-delimiter
        response_accounting: chain
    stream_pipeline:
      - identifier: Disorderer
        stage: static
        params:
          seed: 271828
          displacement_bound: 50
          delay_distribution: uniform
          fraction_displaced: 1.0
          granularity: event
          lag: 8
          claim_order: independent
          format: bridge
      - identifier: Sorter
        stage: dynamic
  - identifier: TimelyMon
    name: TimelyMon common
    branch: development
    commit: 4a0ba6c981be147b85207bfede3399f36502d041
    params:
      worker: 1
      output_mode: 1
      OnlineExperimentContractTool:
        format: csv
        response_mode: event-count
        output_collection_mode: before-delimiter
        input_aggregation_number: 1
    stream_pipeline:
      - identifier: Disorderer
        stage: static
        params: &disorder
          seed: 271828
          displacement_bound: 50
          delay_distribution: uniform
          fraction_displaced: 1.0
          granularity: event
          lag: 8
          claim_order: independent
      - identifier: PrefixRebuilder
        stage: dynamic
  - identifier: TimelyMon
    name: TimelyMon tp-interval
    branch: tpi-late-accounting
    commit: f48d3cc4579c5016477004891c44e1e38e3d6e72
    params:
      worker: 1
      output_mode: 1
      OnlineExperimentContractTool:
        format: csv
        response_mode: event-count
        output_collection_mode: before-delimiter
        input_aggregation_number: 1
    stream_pipeline:
      - identifier: Disorderer
        stage: static
        params: *disorder
  - identifier: OOOMon
    name: OOOMon
    branch: ooomon-late-guard
    commit: a4bade90c133bd1e4d3dd1b3a9ce3470bd31629a
    params:
      OnlineExperimentContractTool:
        format: csv
        response_mode: event-count
        output_collection_mode: before-delimiter
        input_aggregation_number: 1
    stream_pipeline:
      - identifier: Disorderer
        stage: static
        params: *disorder

data_setup:
  type: SignatureContract
  SignatureContract:
    trace_length: 100
    event_rate: 10
    domain: 30

policy_setup:
  type: MfotlPolicyContract
  MfotlPolicyContract:
    num_preds: 4
    lb: 0
    ub: 10
    delta: 10
    unbounded: False
    prob_once: 0.2
    prob_since: 0.2
    prob_eventually: 0.2
    prob_until: 0.2
    prob_prev: 0
    prob_next: 0
    prob_eand: 0
    prob_rand: 0
    prob_let: 0
    prob_matchF: 0
    prob_matchP: 0

synthetic_config:
  data_source: SignatureGenerator
  policy_source: MfotlPolicyGenerator
  experiment:
    num_operators: [10]
    num_fvs: [2]
    num_setting: [31, 32, 41, 42, 81, 82, 91, 92, 141, 142, 211, 212]
    num_data_set_sizes: [100]

experiment_type: Signature

tools_to_build:
  - MonPoly
  - TimelyMon common
  - TimelyMon tp-interval
  - OOOMon

oracle:
  enabled: false

seeds:
  '[10, 2, 31, 100]': [314159265, 3]
  '[10, 2, 32, 100]': [271828182, 3]
  '[10, 2, 41, 100]': [314159265, 4]
  '[10, 2, 42, 100]': [271828182, 4]
  '[10, 2, 81, 100]': [314159265, 8]
  '[10, 2, 82, 100]': [271828182, 8]
  '[10, 2, 91, 100]': [314159265, 9]
  '[10, 2, 92, 100]': [271828182, 9]
  '[10, 2, 141, 100]': [314159265, 14]
  '[10, 2, 142, 100]': [271828182, 14]
  '[10, 2, 211, 100]': [314159265, 21]
  '[10, 2, 212, 100]': [271828182, 21]

components:
  - identifier: SignatureGenerator
    commit: d8442ab1473ea8f0a9c49836d3bf56bfd0b60672
  - identifier: MfotlPolicyGenerator
    commit: fef5f8f5551a36dac4aa45cc7c48bef09964a265
  - identifier: OnlineExperimentDriver
