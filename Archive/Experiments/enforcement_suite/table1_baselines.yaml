# EnfFlash evaluation, Table 1 (tab:micro): the baselines Enfpoly, EnfGuard,
# Dogwood and MonPoly on the EnfGuard benchmark suite, at the tool versions,
# timeouts and repetitions of the paper. Per-time-point latencies are the
# rounds' `[Elapsed]` (output_pairs); the last round also contains the tool's
# exit, as no echo follows the last time-point. The setting index is the
# formula's line in the case study's instructions.txt (alphabetical order).

